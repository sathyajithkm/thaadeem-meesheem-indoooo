<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beard-O-Meter</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>🧔 Beard-O-Meter</h1>

        <p>
            The world's completely unnecessary
            beard & moustache prediction system 😂
        </p>

        <div class="card">

            <h2>Upload Your Face</h2>

            <form action="/upload" method="POST" enctype="multipart/form-data">

                <input
                    type="file"
                    name="photo"
                    accept="image/png, image/jpeg, image/jpg, image/webp"
                    required
                >

                <button type="submit">
                    Analyze My Beard 🧔
                </button>

            </form>

        </div>

    </div>

</body>

</html>
